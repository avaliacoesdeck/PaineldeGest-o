<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Gestão | Deck Churrascaria</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root { --deck-wood: #d2995e; --star-active: #f1c40f; --bg-glass: rgba(0, 0, 0, 0.45); }

        body {
            font-family: 'Segoe UI', sans-serif; color: white;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('madeira.JPG'); 
            background-size: 350px; background-repeat: repeat; background-attachment: fixed;
            padding-bottom: 40px; min-height: 100vh;
        }

        header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo-img { width: 120px; filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.8)); margin-bottom: 10px; }
        .painel-title { font-size: 1.2rem; font-weight: 900; color: var(--deck-wood); text-transform: uppercase; letter-spacing: 2px; }

        /* TELA DE LOGIN */
        #tela-login {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%; position: fixed; top: 0; left: 0; z-index: 999;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('madeira.JPG');
            background-size: cover; padding: 20px;
        }
        .login-box {
            background: var(--bg-glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--deck-wood); border-radius: 20px; padding: 30px 20px;
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .login-box h2 { color: #fff; margin-bottom: 20px; font-size: 1.3rem; text-transform: uppercase; }
        .login-box input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6); color: white; font-size: 1.1rem; text-align: center; margin-bottom: 15px; outline: none;
        }
        .login-box input:focus { border-color: var(--deck-wood); box-shadow: 0 0 10px rgba(210, 153, 94, 0.5); }
        #erro-senha { color: #e74c3c; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: none; animation: tremer 0.3s; }

        @keyframes tremer {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* PAINEL PRINCIPAL (Oculto por padrão) */
        #painel-principal { display: none; }

        .container { width: 95%; max-width: 600px; margin: 20px auto; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        
        .stat-card {
            background: var(--bg-glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px 10px; text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .stat-card i { font-size: 2rem; color: var(--deck-wood); margin-bottom: 10px; }
        .stat-num { font-size: 2.2rem; font-weight: 900; margin: 5px 0; text-shadow: 2px 2px 5px #000; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #ccc; font-weight: bold; }

        .btn-action {
            width: 100%; padding: 18px; border-radius: 12px; font-weight: 900; font-size: 1rem; 
            cursor: pointer; text-transform: uppercase; margin-bottom: 15px; border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: 0.2s;
        }
        .btn-sorteio { background: var(--deck-wood); color: #000; animation: pulsaSorteio 2s infinite; }
        .btn-atualizar { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        .btn-atualizar:active { background: rgba(255,255,255,0.3); }
        
        @keyframes pulsaSorteio { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .section-title { font-size: 1.1rem; color: var(--deck-wood); margin: 30px 0 15px; border-bottom: 1px solid rgba(210, 153, 94, 0.3); padding-bottom: 5px; text-transform: uppercase; }

        .review-card {
            background: var(--bg-glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-left: 4px solid var(--deck-wood);
            border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative;
        }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .review-name { font-weight: bold; font-size: 1.1rem; color: #fff; }
        .review-date { font-size: 0.75rem; color: #aaa; }
        
        .review-stars { color: var(--star-active); font-size: 0.9rem; margin-bottom: 8px; text-shadow: 0 0 5px rgba(241, 196, 15, 0.3); }
        .review-text { font-size: 0.9rem; color: #ddd; line-height: 1.4; font-style: italic; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
        
        .review-contact { margin-top: 12px; display: flex; gap: 10px; }
        .btn-zap { background: #25D366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        
        #loading { text-align: center; padding: 30px; color: var(--deck-wood); font-weight: bold; display: none; }
        .fa-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-box">
            <img src="logo-deck.PNG" alt="Logo Deck" class="logo-img" onerror="this.style.display='none'">
            <h2><i class="fas fa-lock"></i> Digite a senha para acessar o painel de gestão</h2>
            <input type="password" id="input-senha" placeholder="Digite a Senha">
            <div id="erro-senha"><i class="fas fa-exclamation-circle"></i> Senha incorreta!</div>
            <button class="btn-action btn-sorteio" style="animation: none;" onclick="verificarSenha()">ENTRAR</button>
        </div>
    </div>

    <div id="painel-principal">
        <header>
            <img src="logo-deck.PNG" alt="Logo Deck" class="logo-img" onerror="this.style.display='none'">
            <div class="painel-title"><i class="fas fa-chart-line"></i> Painel de Gestão Deck (Avaliações)</div>
        </header>

        <div class="container">
            
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div class="stat-num" id="total-avaliacoes">0</div>
                    <div class="stat-label">Avaliações Recebidas</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-star"></i>
                    <div class="stat-num" id="media-notas">0.0</div>
                    <div class="stat-label">Média (Refeição)</div>
                </div>
            </div>

            <button class="btn-action btn-sorteio" id="btn-sortear">
                <i class="fas fa-gift"></i> Sortear Picanha P/2
            </button>
            <button class="btn-action btn-atualizar" onclick="carregarDados()">
                <i class="fas fa-sync-alt"></i> Atualizar Dados
            </button>

            <h2 class="section-title"><i class="fas fa-comments"></i> Últimas Avaliações</h2>

            <div id="loading"><i class="fas fa-spinner"></i> Carregando dados da planilha...</div>
            
            <div id="lista-avaliacoes">
                </div>

        </div>
    </div>

    <script>
        // 🚨🚨🚨 COLE SEU LINK DO GOOGLE AQUI DENTRO DAS ASPAS 🚨🚨🚨
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw0kKVol2sjUI2oXhv28n62slRX5vFAhIBhIMdj6pAYCweBVrYhZMFSkQ9IB4-Tp2VumA/exec';
        
        // 🔐🔐🔐 DEFINA A SUA SENHA AQUI 🔐🔐🔐
        const SENHA_CORRETA = "Deck2026";
        
        let dadosGlobais = [];

        // SISTEMA DE LOGIN
        function verificarSenha() {
            let senhaDigitada = document.getElementById('input-senha').value;
            let msgErro = document.getElementById('erro-senha');

            if(senhaDigitada === SENHA_CORRETA) {
                // Se a senha estiver certa, esconde o login, mostra o painel e carrega os dados
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('painel-principal').style.display = 'block';
                carregarDados();
            } else {
                // Se errar a senha
                msgErro.style.display = 'block';
                document.getElementById('input-senha').value = '';
            }
        }

        function renderStars(nota) {
            let num = parseInt(nota) || 0;
            let starsHTML = '';
            for(let i=1; i<=5; i++) {
                if(i <= num) starsHTML += '<i class="fas fa-star"></i>';
                else starsHTML += '<i class="far fa-star"></i>';
            }
            return starsHTML;
        }

        function formatData(dataString) {
            if(!dataString) return '';
            const data = new Date(dataString);
            return data.toLocaleDateString('pt-BR');
        }

        function cleanZap(zap) {
            return zap.replace(/\D/g, ''); 
        }

        function carregarDados() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('lista-avaliacoes').innerHTML = '';

            fetch(scriptURL)
            .then(response => response.json())
            .then(data => {
                dadosGlobais = data; 
                document.getElementById('loading').style.display = 'none';
                
                if(data.length === 0) {
                    document.getElementById('lista-avaliacoes').innerHTML = '<p style="text-align:center; color:#aaa;">Nenhuma avaliação ainda.</p>';
                    return;
                }

                document.getElementById('total-avaliacoes').innerText = data.length;
                
                let somaNotas = 0;
                data.forEach(item => { somaNotas += parseInt(item.refeicao) || 0; });
                let media = (somaNotas / data.length).toFixed(1);
                document.getElementById('media-notas').innerText = media;

                let htmlLista = '';
                for(let i = data.length - 1; i >= 0; i--) {
                    let item = data[i];
                    let nota = parseInt(item.refeicao) || 0;
                    
                    let borderColor = nota <= 3 ? '#e74c3c' : 'var(--deck-wood)';
                    let starsColor = nota <= 3 ? '#e74c3c' : 'var(--star-active)';
                    let textoSugestao = item.sugestoes ? `"${item.sugestoes}"` : "<i>(Sem sugestões escritas)</i>";
                    let zapLimpo = cleanZap(item.whatsapp);

                    htmlLista += `
                    <div class="review-card" style="border-left-color: ${borderColor};">
                        <div class="review-header">
                            <span class="review-name">${item.nome}</span>
                            <span class="review-date">${formatData(item.dataRegistro)}</span>
                        </div>
                        <div class="review-stars" style="color: ${starsColor};">
                            ${renderStars(nota)}
                        </div>
                        <div class="review-text">
                            ${textoSugestao}
                        </div>
                        <div class="review-contact">
                            <a href="https://wa.me/55${zapLimpo}" target="_blank" class="btn-zap">
                                <i class="fab fa-whatsapp"></i> Chamar Cliente
                            </a>
                        </div>
                    </div>`;
                }

                document.getElementById('lista-avaliacoes').innerHTML = htmlLista;
            })
            .catch(error => {
                document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro ao carregar. Verifique o link do script.';
                console.error('Erro:', error);
            });
        }

        // Função de Sortear
        document.getElementById('btn-sortear').addEventListener('click', () => {
            if(dadosGlobais.length === 0) {
                alert("Ainda não há clientes na base para sortear!");
                return;
            }
            
            // Escolhe um número aleatório do tamanho da lista
            let indiceSorteado = Math.floor(Math.random() * dadosGlobais.length);
            let ganhador = dadosGlobais[indiceSorteado];
            
            // Exibe o vencedor na tela
            alert(`🎉 GANHADOR DO SORTEIO!\n\nNome: ${ganhador.nome}\nZap: ${ganhador.whatsapp}\n\nEntre em contato para avisar sobre a Picanha!`);
        });

    </script>
</body>
</html>
