<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Gestão | Deck Churrascaria</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root { --deck-wood: #d2995e; --star-active: #f1c40f; --bg-glass: rgba(0, 0, 0, 0.45); }

        body {
            font-family: 'Segoe UI', sans-serif; color: white;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('madeira.JPG'); 
            background-size: 350px; background-repeat: repeat; background-attachment: fixed;
            padding-bottom: 40px; min-height: 100vh;
        }

        header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo-img { width: 120px; filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.8)); margin-bottom: 10px; }
        .painel-title { font-size: 1.2rem; font-weight: 900; color: var(--deck-wood); text-transform: uppercase; letter-spacing: 2px; }

        /* LOGIN */
        #tela-login {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%; position: fixed; top: 0; left: 0; z-index: 999;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('madeira.JPG');
            background-size: cover; padding: 20px;
        }
        .login-box {
            background: var(--bg-glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--deck-wood); border-radius: 20px; padding: 30px 20px;
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .login-box h2 { font-size: 1.1rem; margin-bottom: 20px; text-transform: uppercase; }
        .login-box input {
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6); color: white; font-size: 1.1rem; text-align: center; margin-bottom: 15px; outline: none;
        }
        #erro-senha { color: #e74c3c; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: none; }

        /* PAINEL */
        #painel-principal { display: none; }
        .container { width: 95%; max-width: 600px; margin: 20px auto; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .stat-card {
            background: var(--bg-glass); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px 5px; text-align: center;
        }
        .stat-card i { font-size: 1.5rem; color: var(--deck-wood); margin-bottom: 5px; }
        .stat-num { font-size: 1.8rem; font-weight: 900; color: #fff; text-shadow: 2px 2px 5px #000; }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; color: #ccc; font-weight: bold; }

        .btn-action {
            width: 100%; padding: 18px; border-radius: 12px; font-weight: 900; font-size: 1rem; 
            cursor: pointer; text-transform: uppercase; margin-bottom: 15px; border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-sorteio { background: var(--deck-wood); color: #000; animation: pulsaSorteio 2s infinite; }
        .btn-atualizar { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        
        @keyframes pulsaSorteio { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .section-title { font-size: 1.1rem; color: var(--deck-wood); margin: 30px 0 15px; border-bottom: 1px solid rgba(210, 153, 94, 0.3); padding-bottom: 5px; text-transform: uppercase; }

        /* REVIEW CARD */
        .review-card {
            background: var(--bg-glass); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-left: 4px solid var(--deck-wood);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .review-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .review-name { font-weight: bold; font-size: 1.1rem; color: #fff; }
        .review-date-box { text-align: right; font-size: 0.75rem; color: #aaa; line-height: 1.2; }
        .review-time { font-size: 0.65rem; color: var(--deck-wood); display: block; }
        
        .review-stars-box {
            display: grid; grid-template-columns: 1fr; gap: 5px; margin: 10px 0; 
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; 
            border: 1px solid rgba(210, 153, 94, 0.15);
        }
        .star-row { font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        
        .review-info { font-size: 0.85rem; color: var(--deck-wood); margin: 10px 0; font-weight: bold; }
        .review-text { font-size: 0.9rem; color: #ddd; font-style: italic; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
        .btn-zap { background: #25D366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; }

        /* MODAL */
        #modal-sorteio {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #111; border: 3px solid var(--deck-wood); border-radius: 25px;
            padding: 30px; width: 100%; max-width: 400px; text-align: center;
        }
        .winner-name { font-size: 1.8rem; font-weight: 900; margin: 15px 0; color: #fff; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-box">
            <img src="logo-deck.PNG" alt="Logo" style="width:100px; margin-bottom:15px;" onerror="this.style.display='none'">
            <h2><i class="fas fa-lock"></i> Digite a senha de Acesso</h2>
            <input type="password" id="input-senha" placeholder="Digite a senha">
            <div id="erro-senha">Senha incorreta!</div>
            <button class="btn-action btn-sorteio" style="animation:none" onclick="verificarSenha()">ENTRAR</button>
        </div>
    </div>

    <div id="painel-principal">
        <header>
            <img src="logo-deck.PNG" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="painel-title">Painel de Gestão Deck (Avaliações)</div>
        </header>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-utensils"></i>
                    <div class="stat-num" id="med-refeicao">0.0</div>
                    <div class="stat-label">Refeição</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-user-tie"></i>
                    <div class="stat-num" id="med-atendimento">0.0</div>
                    <div class="stat-label">Atendimento</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-thumbs-up"></i>
                    <div class="stat-num" id="med-recomenda">0.0</div>
                    <div class="stat-label">Indicação</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div class="stat-num" id="total-avaliacoes">0</div>
                    <div class="stat-label">Total de Avaliações</div>
                </div>
            </div>

            <button class="btn-action btn-sorteio" id="btn-sortear">
                <i class="fas fa-trophy"></i> SORTEAR PICANHA P/2
            </button>
            <button class="btn-action btn-atualizar" onclick="carregarDados()">
                <i class="fas fa-sync-alt"></i> ATUALIZAR DADOS
            </button>

            <h2 class="section-title"><i class="fas fa-comments"></i> Últimas Avaliações</h2>
            <div id="loading" style="text-align:center; padding:20px; font-weight:bold; color:var(--deck-wood);"><i class="fas fa-spinner fa-spin"></i> CARREGANDO...</div>
            <div id="lista-avaliacoes"></div>
        </div>
    </div>

    <div id="modal-sorteio">
        <div class="modal-content">
            <i class="fas fa-gift" style="font-size:3rem; color:var(--deck-wood); margin-bottom:10px;"></i>
            <h2 style="color: var(--deck-wood);">TEMOS UM GANHADOR!</h2>
            <div class="winner-name" id="win-nome">NOME</div>
            <a href="#" id="btn-zap-ganhador" target="_blank" class="btn-action" style="background:#25D366; color:white;">
                <i class="fab fa-whatsapp"></i> AVISAR PELO WHATSAPP
            </a>
            <button onclick="document.getElementById('modal-sorteio').style.display='none'" style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer;">Fechar Janela</button>
        </div>
    </div>

    <script>
        // 🚨 COLE SEU LINK NOVO AQUI 🚨
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyH8WZkwCxFZi1vdbayA8e-FqcUspJTZyIqr7e9Hqpdk8rHHatEJPaB6s9KyseYqrh_rA/exec'; 
        const SENHA_CORRETA = "Deck2026";
        let dadosGlobais = [];

        function verificarSenha() {
            if(document.getElementById('input-senha').value === SENHA_CORRETA) {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('painel-principal').style.display = 'block';
                carregarDados();
            } else {
                document.getElementById('erro-senha').style.display = 'block';
            }
        }

        function renderStars(nota) {
            let num = parseInt(nota) || 0;
            let h = '';
            for(let i=1; i<=5; i++) h += (i <= num) ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
            return h;
        }

        function carregarDados() {
            const listDiv = document.getElementById('lista-avaliacoes');
            const loadDiv = document.getElementById('loading');
            loadDiv.style.display = 'block';
            listDiv.innerHTML = '';

            fetch(scriptURL).then(res => res.json()).then(data => {
                dadosGlobais = data;
                loadDiv.style.display = 'none';
                document.getElementById('total-avaliacoes').innerText = data.length;
                
                let sRef=0, sAtend=0, sRec=0;
                data.forEach(d => {
                    sRef += (parseInt(d.refeicao) || 0);
                    sAtend += (parseInt(d.atendimento) || 0);
                    sRec += (parseInt(d.recomenda) || 0);
                });
                
                const n = data.length || 1;
                document.getElementById('med-refeicao').innerText = (sRef/n).toFixed(1);
                document.getElementById('med-atendimento').innerText = (sAtend/n).toFixed(1);
                document.getElementById('med-recomenda').innerText = (sRec/n).toFixed(1);

                let html = '';
                for(let i = data.length - 1; i >= 0; i--) {
                    let d = data[i];
                    let zap = d.whatsapp ? d.whatsapp.toString().replace(/\D/g, '') : '';
                    
                    // Separa Data e Hora do texto formatado (ex: "28/03/2026 17:30:00")
                    let partes = d.dataRegistro ? d.dataRegistro.split(' ') : ['Sem data', ''];
                    let dataFormatada = partes[0];
                    let horaFormatada = partes[1] ? partes[1].substring(0,5) : '';
                    
                    html += `
                    <div class="review-card">
                        <div class="review-header">
                            <span class="review-name">${d.nome}</span>
                            <div class="review-date-box">
                                ${dataFormatada}
                                <span class="review-time"><i class="far fa-clock"></i> ${horaFormatada}</span>
                            </div>
                        </div>

                        <div class="review-stars-box">
                            <div class="star-row"><span>🍴 Refeição:</span><span style="color:var(--star-active)">${renderStars(d.refeicao)}</span></div>
                            <div class="star-row"><span>🛎️ Atendimento:</span><span style="color:var(--star-active)">${renderStars(d.atendimento)}</span></div>
                            <div class="star-row"><span>👍 Indicação:</span><span style="color:var(--star-active)">${renderStars(d.recomenda)}</span></div>
                        </div>

                        <div class="review-info">Nos conheçeu Via: ${d.comoConheceu || 'Não informado'}</div>
                        <div class="review-text">${d.sugestoes || '<i>Sem sugestões escritas</i>'}</div>
                        
                        <a href="https://wa.me/55${zap}" target="_blank" class="btn-zap">
                            <i class="fab fa-whatsapp"></i> Chamar Cliente
                        </a>
                    </div>`;
                }
                listDiv.innerHTML = html;
            }).catch(err => { loadDiv.innerText = "Erro ao carregar dados."; });
        }

        document.getElementById('btn-sortear').addEventListener('click', () => {
            if(!dadosGlobais.length) return alert("Sem dados!");
            let g = dadosGlobais[Math.floor(Math.random() * dadosGlobais.length)];
            document.getElementById('win-nome').innerText = g.nome;
            document.getElementById('btn-zap-ganhador').href = `https://wa.me/55${g.whatsapp.toString().replace(/\D/g, '')}?text=Olá ${g.nome}! Parabéns, você ganhou o sorteio do Deck! 🥩🎉`;
            document.getElementById('modal-sorteio').style.display = 'flex';
        });

        function fecharModal() { document.getElementById('modal-sorteio').style.display = 'none'; }
    </script>
</body>
</html>
